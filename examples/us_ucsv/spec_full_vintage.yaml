# US UCSV example, full vintage through 2026Q1 with the COVID quarters
# included and NO hand-set COVID machinery: the SV on both shocks absorbs
# 2020-21 endogenously (the same exhibit the lw_sv full-vintage run makes).
model:
  family: ucsv
  options:
    sv_shocks: [eps, eta]
data:
  file: data/us_core_pce.csv
  date_column: date
  mapping: { pi: core_pce_ann }
  sample: { start: null, end: null }
priors: { }
sampler:
  chains: 4
  warmup: 1000
  sampling: 1000
  adapt_delta: 0.95
  max_treedepth: 12
  seed: 20260813
outputs: { }
