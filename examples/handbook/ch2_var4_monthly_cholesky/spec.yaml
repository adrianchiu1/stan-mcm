        + b_unemployment_bond10y_2*bond10y[-2] + b_unemployment_unemployment_2*unemployment[-2]
        + b_unemployment_inflation_2*inflation[-2] + e_unemployment
      - inflation = c_inflation + a0_inflation_ffr*ffr + a0_inflation_bond10y*bond10y
        + a0_inflation_unemployment*unemployment + b_inflation_ffr_1*ffr[-1] + b_inflation_bond10y_1*bond10y[-1]
