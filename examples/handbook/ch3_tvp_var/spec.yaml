model:
  family: authored
  options:
    family: authored
    name: ch3_tvp_var
    observables:
    - gdp_growth
    - cpi_inflation
    - ffr
    exogenous: []
    equations:
      measurement:
      - gdp_growth = c_gdp_growth + b_gdp_growth_gdp_growth_1*gdp_growth[-1] + b_gdp_growth_cpi_inflation_1*cpi_inflation[-1]
        + b_gdp_growth_ffr_1*ffr[-1] + b_gdp_growth_gdp_growth_2*gdp_growth[-2] +
        b_gdp_growth_cpi_inflation_2*cpi_inflation[-2] + b_gdp_growth_ffr_2*ffr[-2]
        + e_gdp_growth
      - cpi_inflation = c_cpi_inflation + a0_cpi_inflation_gdp_growth*gdp_growth +
        b_cpi_inflation_gdp_growth_1*gdp_growth[-1] + b_cpi_inflation_cpi_inflation_1*cpi_inflation[-1]
        + b_cpi_inflation_ffr_1*ffr[-1] + b_cpi_inflation_gdp_growth_2*gdp_growth[-2]
        + b_cpi_inflation_cpi_inflation_2*cpi_inflation[-2] + b_cpi_inflation_ffr_2*ffr[-2]
        + e_cpi_inflation
      - ffr = c_ffr + a0_ffr_gdp_growth*gdp_growth + a0_ffr_cpi_inflation*cpi_inflation
        + b_ffr_gdp_growth_1*gdp_growth[-1] + b_ffr_cpi_inflation_1*cpi_inflation[-1]
        + b_ffr_ffr_1*ffr[-1] + b_ffr_gdp_growth_2*gdp_growth[-2] + b_ffr_cpi_inflation_2*cpi_inflation[-2]
        + b_ffr_ffr_2*ffr[-2] + e_ffr
      transition:
      - c_gdp_growth = c_gdp_growth[-1] + eta_c_gdp_growth
      - b_gdp_growth_gdp_growth_1 = b_gdp_growth_gdp_growth_1[-1] + eta_b_gdp_growth_gdp_growth_1
      - b_gdp_growth_cpi_inflation_1 = b_gdp_growth_cpi_inflation_1[-1] + eta_b_gdp_growth_cpi_inflation_1
      - b_gdp_growth_ffr_1 = b_gdp_growth_ffr_1[-1] + eta_b_gdp_growth_ffr_1
      - b_gdp_growth_gdp_growth_2 = b_gdp_growth_gdp_growth_2[-1] + eta_b_gdp_growth_gdp_growth_2
      - b_gdp_growth_cpi_inflation_2 = b_gdp_growth_cpi_inflation_2[-1] + eta_b_gdp_growth_cpi_inflation_2
      - b_gdp_growth_ffr_2 = b_gdp_growth_ffr_2[-1] + eta_b_gdp_growth_ffr_2
      - c_cpi_inflation = c_cpi_inflation[-1] + eta_c_cpi_inflation
      - b_cpi_inflation_gdp_growth_1 = b_cpi_inflation_gdp_growth_1[-1] + eta_b_cpi_inflation_gdp_growth_1
      - b_cpi_inflation_cpi_inflation_1 = b_cpi_inflation_cpi_inflation_1[-1] + eta_b_cpi_inflation_cpi_inflation_1
      - b_cpi_inflation_ffr_1 = b_cpi_inflation_ffr_1[-1] + eta_b_cpi_inflation_ffr_1
      - b_cpi_inflation_gdp_growth_2 = b_cpi_inflation_gdp_growth_2[-1] + eta_b_cpi_inflation_gdp_growth_2
      - b_cpi_inflation_cpi_inflation_2 = b_cpi_inflation_cpi_inflation_2[-1] + eta_b_cpi_inflation_cpi_inflation_2
      - b_cpi_inflation_ffr_2 = b_cpi_inflation_ffr_2[-1] + eta_b_cpi_inflation_ffr_2
      - c_ffr = c_ffr[-1] + eta_c_ffr
      - b_ffr_gdp_growth_1 = b_ffr_gdp_growth_1[-1] + eta_b_ffr_gdp_growth_1
      - b_ffr_cpi_inflation_1 = b_ffr_cpi_inflation_1[-1] + eta_b_ffr_cpi_inflation_1
      - b_ffr_ffr_1 = b_ffr_ffr_1[-1] + eta_b_ffr_ffr_1
      - b_ffr_gdp_growth_2 = b_ffr_gdp_growth_2[-1] + eta_b_ffr_gdp_growth_2
      - b_ffr_cpi_inflation_2 = b_ffr_cpi_inflation_2[-1] + eta_b_ffr_cpi_inflation_2
      - b_ffr_ffr_2 = b_ffr_ffr_2[-1] + eta_b_ffr_ffr_2
    parameters:
      s_gdp_growth:
        dist: half_normal
        sd: 2.0
      sq_gdp_growth:
        dist: half_normal
        sd: 0.01
      a0_cpi_inflation_gdp_growth:
