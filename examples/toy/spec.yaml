# S1 toy example: local-level model on synthetic data.
#
# Data generated by scripts/generate_toy_data.py (fixed seed 20260813,
# true sigma_obs=0.4, sigma_level=0.3) -- see that script's docstring.
model:
  family: local_level
  options: {}

data:
  file: data.csv
  date_column: date
  mapping: { y: obs }
  sample: { start: null, end: null }

priors: {}

sampler:
  chains: 4
  warmup: 1000
  sampling: 1000
  adapt_delta: 0.9
  max_treedepth: 10
  seed: 20260813

outputs: {}
